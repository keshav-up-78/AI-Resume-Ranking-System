# Approach summary
methodology_summary: |
  "The ranking pipeline begins by converting the job description into structured text. Candidate profiles from the JSONL dataset are first filtered using technical job titles to reduce the search space and improve ranking efficiency. The filtered candidate profiles are then converted into text, and their embeddings are precomputed using the locally hosted SentenceTransformer (all-MiniLM-L6-v2) model and stored as a NumPy (.npy) file. During ranking, only the job description embedding is generated, and cosine similarity is computed against the precomputed candidate embeddings to obtain the semantic score. Additional rule-based scores are calculated from structured profile information, including experience, skills, and Redrob platform signals. These weighted components are combined into a final ranking score for every candidate. Candidates are sorted in descending order, personalized reasoning is generated based on their profile attributes, and the top 100 candidates are exported as the final submission CSV. The complete ranking pipeline runs locally on a CPU without external API calls during inference, meeting the hackathon's runtime and compute constraints."

